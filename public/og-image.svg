<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Deep Dive: The Whales of the Ocean">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35c7e0" />
      <stop offset="0.45" stop-color="#0a4d8c" />
      <stop offset="1" stop-color="#01030a" />
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#7ee8fa" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#7ee8fa" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sea)" />
  <rect width="1200" height="630" fill="url(#light)" />

  <!-- Whale silhouette -->
  <path
    fill="rgba(1,3,10,0.55)"
    d="M120 430 C 260 320, 520 300, 760 340 C 860 356, 940 360, 1000 330 C 970 366, 966 400, 990 430 C 940 424, 890 420, 840 428 C 620 460, 360 470, 220 500 C 176 480, 140 456, 120 430 Z"
  />
  <circle cx="220" cy="420" r="9" fill="#5ffbf1" opacity="0.85" />

  <text x="600" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif"
        font-size="42" letter-spacing="10" fill="#eaf9fd" opacity="0.85">DEEP DIVE</text>
  <text x="600" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif"
        font-size="86" font-weight="800" fill="#f4feff">The Whales of the Ocean</text>
  <text x="600" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif"
        font-size="30" fill="#d6e6fb">From the sunlit surface to the crushing abyss</text>
</svg>
